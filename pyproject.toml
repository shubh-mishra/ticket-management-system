[project]
name = "ticket-system"
version = "0.1.0"
description = ""
authors = [
    {name = "shubh-mishra",email = "shubhamshekhar56@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.162.0,<0.163.0)",
